[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openexactfit"
version = "0.1.0"
description = "read blood pressure measurements from a braun exactfit 5 connect (bua6350) over bluetooth low energy, without the vendor app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exactfit = "exactfit.cli:main"

[tool.setuptools.packages.find]
include = ["exactfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
